name: Android CI

# Runs on every branch push (not just master) so feature branches get a real
# Android build + test run before they're merged, plus manually on demand.
# Pushes that only touch nodes/ (the crawler's node-list updates) build nothing.
on:
  push:
    paths-ignore: ['nodes/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      # Caches Gradle's dependency and build caches between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Release builds go through R8 (minify + resource shrinking); building one here catches
      # missing keep rules / R8 errors before a release does.
      - name: Assemble release APK (R8)
        run: ./gradlew assembleRelease --no-daemon

      # Reported but not (yet) blocking: the existing code base has never been linted, so the
      # first runs establish what's there before lint is allowed to fail the build.
      - name: Android lint
        run: ./gradlew lintDebug --no-daemon
        continue-on-error: true

  # The wide-range layer's Go module (p2p-go/) is outside the Gradle build, so it gets its own job.
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: p2p-go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: p2p-go/go.mod
          cache-dependency-path: p2p-go/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::Run gofmt -w on the files above"; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race ./...

  # Builds the app against the real go-libp2p binding (p2p-go/node via gomobile) instead
  # of the stub build-and-test compiles - the only check that app/src/main/kotlin-p2p-real
  # still matches the Go API. Its own job, in parallel, so build-and-test never waits on it.
  android-real-p2p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: p2p-go/go.mod
          cache-dependency-path: p2p-go/go.sum

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # gomobile picks the NDK up from ANDROID_NDK_HOME. No `gomobile init` step: for Android
      # all it does is install gobind@latest, and the gomobileBind task installs the gomobile
      # and gobind versions pinned in p2p-go/go.mod instead.
      - name: Use the runner's preinstalled NDK
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            echo "::error::No Android NDK on this runner (ANDROID_NDK_LATEST_HOME/ANDROID_NDK_HOME unset)"
            exit 1
          fi
          echo "Using the NDK at $ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build the go-libp2p binding
        run: ./gradlew gomobileBind --no-daemon

      - name: Check the binding was built
        run: |
          if [ ! -s p2p-go/build/p2pgo.aar ]; then
            echo "::error::gomobileBind didn't produce p2p-go/build/p2pgo.aar"
            exit 1
          fi
          unzip -l p2p-go/build/p2pgo.aar

      # A separate Gradle run: app/build.gradle.kts picks the real binding over the stub at
      # configuration time, depending on whether the .aar exists yet.
      - name: Assemble debug APK with the real binding
        run: ./gradlew assembleDebug --no-daemon

      - name: Check the APK carries the Go library
        run: |
          if ! unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libgojni.so'; then
            echo "::error::app-debug.apk doesn't contain libgojni.so - the stub was built instead of the real binding"
            exit 1
          fi
