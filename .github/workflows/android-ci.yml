name: Android CI

# Runs on every branch push (not just master) so feature branches get a real
# Android build + test run before they're merged, plus manually on demand.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      # Caches Gradle's dependency and build caches between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Reported but not (yet) blocking: the existing code base has never been linted, so the
      # first runs establish what's there before lint is allowed to fail the build.
      - name: Android lint
        run: ./gradlew lintDebug --no-daemon
        continue-on-error: true

  # The wide-range layer's Go module (p2p-go/) is outside the Gradle build, so it gets its own job.
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: p2p-go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: p2p-go/go.mod
          cache-dependency-path: p2p-go/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race ./...
