name: Release

# Publishes a downloadable, installable release APK on GitHub Releases:
#   - every push to master updates the rolling "latest" (pre-)release with the
#     current build, so there's always an up-to-date APK to grab.
#   - pushing a version tag (vX.Y.Z) additionally cuts a proper numbered
#     release for that tag.
#   - a pull request into master only builds it, as a check.

on:
  push:
    branches: [master]
    tags:
      - "v*.*.*"
    # A crawler update of the node list (nodes/) changes nothing in the app, so it
    # doesn't re-publish "latest". Tag pushes ignore path filters, so releases still run.
    paths-ignore: ['nodes/**']
  # Builds (but never publishes - see the steps' `if`s) the release APK for a pull request
  # into master, so a broken release build shows up before the merge.
  pull_request:
    branches: [master]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      # The wide-range (internet) layer is the go-libp2p binding built by gomobile - without it
      # the APK falls back to the stub and FRAD only works over Bluetooth. Same steps as the
      # android-real-p2p job in android-ci.yml.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: p2p-go/go.mod
          cache-dependency-path: p2p-go/go.sum

      - name: Use the runner's preinstalled NDK
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            echo "::error::No Android NDK on this runner (ANDROID_NDK_LATEST_HOME/ANDROID_NDK_HOME unset)"
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build the go-libp2p binding
        run: ./gradlew gomobileBind --no-daemon

      - name: Unit tests
        run: ./gradlew test --no-daemon

      # Optional: only writes a file once a maintainer has generated a real release
      # key and added it as repo secrets (see keystore.properties.sample). Until
      # then FRAD_RELEASE_STORE_FILE points at a file that's never created, so
      # app/build.gradle.kts's hasReleaseSigningConfig check stays false (it also
      # requires the password/alias secrets below) and the release build falls
      # back to debug signing, exactly as before.
      - name: Decode release keystore
        env:
          FRAD_RELEASE_KEYSTORE_BASE64: ${{ secrets.FRAD_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$FRAD_RELEASE_KEYSTORE_BASE64" ]; then
            echo "$FRAD_RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          fi

      - name: Assemble release APK
        env:
          FRAD_RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          FRAD_RELEASE_STORE_PASSWORD: ${{ secrets.FRAD_RELEASE_STORE_PASSWORD }}
          FRAD_RELEASE_KEY_ALIAS: ${{ secrets.FRAD_RELEASE_KEY_ALIAS }}
          FRAD_RELEASE_KEY_PASSWORD: ${{ secrets.FRAD_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Check the APK carries the Go library
        run: |
          if ! unzip -l app/build/outputs/apk/release/app-release.apk | grep -q 'lib/arm64-v8a/libgojni.so'; then
            echo "::error::app-release.apk doesn't contain libgojni.so - the stub was built instead of the real binding"
            exit 1
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "FRAD-${{ github.head_ref || github.ref_name }}.apk"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: FRAD-${{ github.ref_name }}.apk
          generate_release_notes: true

      # softprops/action-gh-release only replaces an asset with the exact same filename - if a
      # rename ever happens again (like FriendRadar-*.apk -> FRAD-*.apk did), the old-named file
      # would otherwise sit there forever instead of being replaced. Wipe every asset off the
      # rolling release first so it only ever holds this run's build.
      - name: Clear stale assets from the "latest" release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null |
            while IFS= read -r name; do
              gh release delete-asset latest "$name" --repo "$GITHUB_REPOSITORY" --yes || true
            done

      - name: Publish rolling "latest" build
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: latest
          name: "Latest build (${{ github.sha }})"
          body: >
            Automatically built from the latest commit on master
            (${{ github.sha }}). Not a stable/tagged release - see the
            Releases page for versioned builds.
          prerelease: true
          make_latest: false
          files: FRAD-${{ github.ref_name }}.apk
