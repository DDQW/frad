name: Release

# Publishes a downloadable, installable release APK on GitHub Releases:
#   - every push to master updates the rolling "latest" (pre-)release with the
#     current build, so there's always an up-to-date APK to grab.
#   - pushing a version tag (vX.Y.Z) additionally cuts a proper numbered
#     release for that tag.

on:
  push:
    branches: [master]
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew test --no-daemon

      # Optional: only present once a maintainer has generated a real release key
      # and added it as repo secrets (see keystore.properties.sample). Until then
      # this step is a no-op and the release build falls back to debug signing,
      # exactly as before - see app/build.gradle.kts.
      - name: Decode release keystore
        if: ${{ secrets.FRAD_RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          FRAD_RELEASE_KEYSTORE_BASE64: ${{ secrets.FRAD_RELEASE_KEYSTORE_BASE64 }}
        run: echo "$FRAD_RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Assemble release APK
        env:
          FRAD_RELEASE_STORE_FILE: ${{ secrets.FRAD_RELEASE_KEYSTORE_BASE64 != '' && format('{0}/release.keystore', runner.temp) || '' }}
          FRAD_RELEASE_STORE_PASSWORD: ${{ secrets.FRAD_RELEASE_STORE_PASSWORD }}
          FRAD_RELEASE_KEY_ALIAS: ${{ secrets.FRAD_RELEASE_KEY_ALIAS }}
          FRAD_RELEASE_KEY_PASSWORD: ${{ secrets.FRAD_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "FriendRadar-${{ github.ref_name }}.apk"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: FriendRadar-${{ github.ref_name }}.apk
          generate_release_notes: true

      - name: Publish rolling "latest" build
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build (${{ github.sha }})"
          body: >
            Automatically built from the latest commit on master
            (${{ github.sha }}). Not a stable/tagged release - see the
            Releases page for versioned builds.
          prerelease: true
          make_latest: false
          files: FriendRadar-${{ github.ref_name }}.apk
