org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# This sandbox's network occasionally corrupts TLS records mid-download
# (AEADBadTagException) on large Maven artifact downloads; retry aggressively
# rather than failing the whole build on a single flaky fetch.
systemProp.org.gradle.internal.repository.max.retries=20
systemProp.org.gradle.internal.repository.initial.backoff=500
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
